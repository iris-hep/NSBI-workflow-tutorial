# Data loader settings - these are specific to the Higgs to tau tau example
data_loader:
  data:
    url: "https://zenodo.org/records/15131565/files/FAIR_Universe_HiggsML_data.zip"
    train_size: 0.75
    processes:
      - htautau
      - ztautau
      - ttbar

  preprocess:
    seed: 54
    selections: >
      DER_mass_transverse_met_lep <= 250.0 and
      DER_mass_vis <= 500.0 and
      DER_sum_pt <= 1000 and
      DER_pt_tot <= 250 and
      DER_deltar_had_lep <= 4.5 and
      DER_pt_h <= 400 and
      DER_pt_ratio_lep_had <= 9.0

  systematics:
    TES_up:
      tes: 1.002
    TES_dn:
      tes: 0.998
    JES_up:
      jes: 1.002
    JES_dn:
      jes: 0.998

  output:
    dir: "./saved_datasets/"

# Data processing settings - these are specific to the example
data_preprocessing:
  fit_config_path: "./config_fit_nsbi.yml"
  num_folds: 10                # k-fold cross-validation: set to 1 to disable
  features:
      - PRI_lep_pt
      - PRI_lep_eta
      - PRI_lep_phi
      - PRI_had_pt
      - PRI_had_eta
      - PRI_had_phi
      - PRI_met
      - PRI_met_phi
      - DER_mass_transverse_met_lep
      - DER_mass_vis
      - DER_pt_h
      - DER_deltar_had_lep
      - DER_pt_tot
      - DER_sum_pt
      - DER_pt_ratio_lep_had
      - DER_met_phi_centrality
      - PRI_jet_leading_pt
      - PRI_jet_leading_eta
      - PRI_jet_leading_phi
      - PRI_jet_all_pt
      - PRI_jet_subleading_pt
      - PRI_jet_subleading_eta
      - PRI_jet_subleading_phi
      - DER_deltaeta_jet_jet
      - DER_mass_jet_jet
      - DER_prodeta_jet_jet
      - DER_lep_eta_centrality
      - PRI_n_jets

preselection_network:
  fit_config_path: "./config_fit_nsbi.yml"
  
  model_path: "./saved_datasets/preselection_model/"
  force_train: true
  load_trained_models: false
  
  training:
    test_size: 0.2
    random_state: 64
    batch_size: 4096
    epochs: 50
    learning_rate: 0.00001
    
    labels:
      htautau: 0
      ttbar: 1
      ztautau: 2
      
  preselection_observable:
    signal_processes: ["htautau"]
    background_processes: ["ttbar", "ztautau"]
    pre_factor_dict:
      htautau: 1.0
      ttbar: 1.0
      ztautau: 1.0
    
  output:
    plots_dir: "./output/plots/preselection_network"


# Settings for nominal density ratio estimation
neural_likelihood_ratio_estimation:
  nsbi_fit_config: "./config_fit_nsbi.yml"
  filter_region: "SR"
  saved_data_path: "./saved_datasets/"
  output_training_dir: "output_training_nominal"
  
  use_log_loss: false
  delete_existing_models: false
  force_train: false

  basis_processes_to_train: ["ttbar", "ztautau", "htautau"]
  num_ensemble_members_evaluation: 20
  num_ensemble_members_training: 20

  ensemble_aggregation_type: "mean"

  # The dict's keys define which samples are in the reference; each spec is one of:
  #   (a) null         -> use the sample's physical event-weight yield as its prior (auto-yield)
  #   (b) <positive number> -> use as the relative prior weight directly (any unit; only ratios matter)
  #   (c) {cap: M}     -> auto-solve the prior so this sample's per-event density ratio is bounded at M
  #   (d) 0  (or false) -> exclude this sample from the reference (handy for toggling without deleting the line)
  reference_priors:
    htautau: null       
    ttbar:   null        
    ztautau: 0    

  # Some default hyper-parameters - quality tested for SBI
  common_training_params: &common_params
    hidden_layers: 4
    neurons: 1000
    number_of_epochs: 100
    batch_size: 10000
    learning_rate: 0.0001
    scalerType: "MinMax"
    
    calibration: false
    recalibrate_output: false
    type_of_calibration: "histogram"
    num_bins_cal: 20
    
    callback: true
    callback_patience: 30
    callback_factor: 0.01

    validation_split: 0.1
    holdout_split: 0.25

    load_trained_models: false  # 'force_train' flag in script overrides this

    verbose: 1
    plot_scaled_features: false
    use_best_checkpoint_model: true

    num_workers: 0

  # Process-specific settings - can be different from the default
  training_settings:
    htautau:
      <<: *common_params
      
    ttbar:
      <<: *common_params
      
    ztautau:
      <<: *common_params



# Section for Systematic Uncertainty Estimation
systematic_uncertainty:
  nsbi_fit_config: "./config_fit_nsbi.yml"
  saved_data_path: "./saved_datasets/"
  output_training_dir: "output_training_systematics"
  filter_region: "SR"
  force_train: true

  use_log_loss: false
  num_ensemble_members_training: 1
  num_ensemble_members_evaluation: 1
  ensemble_aggregation_type: "mean"

  training_settings:
    hidden_layers: 4
    neurons: 1000
    number_of_epochs: 100
    batch_size: 10000
    learning_rate: 0.0001
    scalerType: "MinMax"
    
    calibration: true
    recalibrate_output: false
    type_of_calibration: "histogram"
    num_bins_cal: 20

    callback: true
    callback_patience: 30
    callback_factor: 0.01

    validation_split: 0.1
    holdout_split: 0.25

    verbose: 0
    plot_scaled_features: false
    load_trained_models: false
    use_best_checkpoint_model: true

    num_workers: 0

# Parameter fit settings
parameter_fitting:
  configs:
    histogram: "./config_fit_histogram.yml"   
    nsbi: "./config_fit_nsbi.yml" 
  measurement: "higgs_tautau_signal_strength" 
  freeze_params: []
  # freeze_params: ["JES", "TES"]
  output:
    plots_dir: "./output/plots/parameter_fitting"
  scan:
    parameter: "mu_htautau"
    range: [0.0, 3.0]
    steps: 50

